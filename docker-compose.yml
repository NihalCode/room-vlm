services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      MODEL_NAME: ${MODEL_NAME:-Qwen/Qwen3-VL-4B-Instruct}
      ADAPTER_PATH: ${ADAPTER_PATH:-}
      DEVICE: ${DEVICE:-auto}
      MAX_VIDEO_FRAMES: ${MAX_VIDEO_FRAMES:-32}
      ABSTENTION_THRESHOLD: ${ABSTENTION_THRESHOLD:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      # Mount adapter locally; never commit weights.
      - ${ADAPTER_HOST_PATH:-./outputs/checkpoints}:/adapters:ro
    # Uncomment for NVIDIA Container Toolkit hosts:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  ui:
    build: .
    command: ["python", "web/gradio_app.py"]
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      MODEL_NAME: ${MODEL_NAME:-Qwen/Qwen3-VL-4B-Instruct}
      ADAPTER_PATH: ${ADAPTER_PATH:-}
      DEVICE: ${DEVICE:-auto}
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: 7860
    volumes:
      - ${ADAPTER_HOST_PATH:-./outputs/checkpoints}:/adapters:ro
    depends_on:
      - api
