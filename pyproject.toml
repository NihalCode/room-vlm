[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "room-vlm"
version = "0.1.0"
description = "Fine-tune and deploy a vision-language model for indoor room classification (NYU Depth V2 + Qwen3-VL)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Room VLM Contributors" }]
keywords = ["vlm", "qwen3-vl", "nyu-depth-v2", "lora", "room-classification"]
dependencies = [
  "torch>=2.2.0",
  "torchvision>=0.17.0",
  "transformers>=4.57.0",
  "peft>=0.13.0",
  "accelerate>=1.0.0",
  "bitsandbytes>=0.43.0; platform_system != 'Darwin' or platform_machine != 'arm64'",
  "datasets>=3.0.0",
  "scikit-learn>=1.5.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "Pillow>=10.0.0",
  "PyYAML>=6.0",
  "tqdm>=4.66.0",
  "opencv-python-headless>=4.9.0",
  "matplotlib>=3.8.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
  "gradio>=4.44.0",
  "httpx>=0.27.0",
  "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]

[project.scripts]
room-vlm-security-check = "room_vlm.security_check:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
